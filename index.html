    <script>

      // روی سرور لوکال Vite، همان سورس TypeScript از app.html اجرا میشود.
      (function () {
        var host = window.location.hostname;
        var isLocalDev =
          host === 'localhost' ||
          host === '127.0.0.1' ||
          host === '[::1]' ||
          host === '0.0.0.0';
        window.location.replace(isLocalDev ? '/app.html' : './docs/index.html');
      })();
    </script>
